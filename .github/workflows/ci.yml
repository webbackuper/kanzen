name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: KANZEN

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kanzen
          POSTGRES_USER: kanzen
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kanzen -d kanzen"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kanzen:ci_only_password@localhost:5432/kanzen?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: KANZEN/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Tests E2E (Chromium)
        run: |
          npx playwright install --with-deps chromium
          NODE_ENV=development node prisma/seed.js
          npm run test:e2e
        # Garantit le fonctionnement sur les Node des distributions (sans « type stripping » TypeScript)
        env:
          NODE_OPTIONS: --no-experimental-strip-types

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: KANZEN/package-lock.json
      - run: npm ci
      - name: SBOM CycloneDX
        run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: KANZEN/sbom.cdx.json
      - name: npm audit (bloquant à partir de « high »)
        run: npm audit --audit-level=high
