# KanZen : reverse proxy nginx (TLS avec certificat de la PKI interne)
# Installation : cp /usr/share/kanzen/nginx/kanzen.conf /etc/nginx/conf.d/kanzen.conf
# puis adapter server_name et les chemins des certificats, nginx -t && systemctl reload nginx
# RHEL/Rocky (SELinux) : setsebool -P httpd_can_network_connect 1

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream kanzen_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name kanzen.corp.local;
    return 301 https://$host$request_uri;
}

server {
    # Syntaxe « listen … http2 » : compatible avec toutes les versions de nginx des distributions cibles
    # (RHEL 9 : 1.20 à 1.26 ; Debian 12 : 1.22 ; Ubuntu 24.04 : 1.24). La directive « http2 on; »
    # n'existe qu'à partir de nginx 1.25.1 ; avec 1.25.1 ou plus, on peut l'utiliser à la place
    # (nginx -t signale sinon un simple avertissement « deprecated », sans effet sur le service).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kanzen.corp.local;

    # Certificat serveur émis par la PKI interne (chaîne complète : serveur + intermédiaire)
    ssl_certificate     /etc/kanzen/tls/kanzen.fullchain.pem;
    ssl_certificate_key /etc/kanzen/tls/kanzen.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:KanZen:10m;
    ssl_session_tickets off;

    # Taille max d'upload : garder cohérent avec UPLOAD_MAX_MB (+ marge multipart)
    client_max_body_size 25m;
    server_tokens off;

    access_log /var/log/nginx/kanzen.access.log;
    error_log  /var/log/nginx/kanzen.error.log warn;

    # Compression à la volée des réponses API (JSON) et de l'index. Les corps ne contiennent ni jeton anti-CSRF
    # ni secret reflété (cookie de session hors corps) : risque BREACH négligeable.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript image/svg+xml text/plain;

    # Fichiers du build (noms avec empreinte de contenu) servis directement par nginx, précompressés (.gz générés
    # au build) et mis en cache un an : aucune requête d'asset aux visites suivantes. index.html reste servi par
    # Node (en-têtes de sécurité, CSP) en « no-cache » : une mise à jour du paquet est prise immédiatement.
    location /assets/ {
        alias /opt/kanzen/app/public/assets/;
        gzip_static on;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location /socket.io/ {
        proxy_pass http://kanzen_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://kanzen_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
    }
}
